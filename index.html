<body>
<main id="app"></main>

<script>
(function(){
  const app = document.getElementById("app");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let zoomFrom = null;

  // Phone sizing: bigger artworks on small screens, or custom "mobile" positions
  const phone = matchMedia("(max-width: 640px)");
  function pos(o){
    if(!phone.matches) return o;
    if(o.mobile) return o.mobile;
    const s = GUIDE.mobileScale || 1;
    const w = Math.min(o.w * s, 100);
    const x = Math.max(0, Math.min(100 - w, o.x + o.w / 2 - w / 2));
    return { x: x, y: o.y, w: w };
  }
  const st = o => { const p = pos(o); return `left:${p.x}%;top:${p.y}%;width:${p.w}%`; };
  phone.addEventListener("change", () => route());

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  window.makePh = (label, cls) => {
    const d = document.createElement("div");
    d.className = cls + " ph";
    d.textContent = label;
    return d;
  };
  function img(src, alt, cls){
    if(!src) return `<div class="${cls} ph">${esc(alt)}</div>`;
    return `<img src="${esc(src)}" alt="${esc(alt)}" class="${cls}" onerror="this.replaceWith(makePh(this.alt,'${cls}'))">`;
  }

  const allWorks = () => GUIDE.floors.flatMap(f => f.artworks.map(a => ({a, f})));

  function renderEnter(){
    document.title = "Ctrl+Save | Exhibition guide";
    app.innerHTML = `
      <section class="enter">
        <div class="hero">
          ${img(GUIDE.heroImage, "Axonometric view of the gallery", "hero-img")}
          <a class="pixel-btn" href="#/floors">Enter</a>
        </div>
        <p class="enter-foot">${esc(GUIDE.footer)}</p>
      </section>`;
  }

  function renderFloors(){
    document.title = "Floors | Ctrl+Save";
    app.innerHTML = `
      <nav class="floors" aria-label="Floors">
        ${GUIDE.floors.map(f => `
          <a class="floor-row" href="#/floor/${esc(f.id)}">
            <span class="name">${esc(f.name)}</span>
            ${img(f.elevation, f.name + " elevation", "elev")}
          </a>`).join("")}
        <p class="enter-foot">${esc(GUIDE.footer)}</p>
      </nav>`;
  }

  // Connector lines from a spot on the room to each artwork
  let currentRedraw = null;
  addEventListener("resize", () => currentRedraw && currentRedraw());

  function drawLeaders(stage, f){
    const svg = stage.querySelector(".leaders");
    const room = stage.querySelector(".room");
    const W = stage.offsetWidth, H = stage.offsetHeight;
    if(!svg || !room || !W || !H) return;
    const rx = room.offsetLeft, ry = room.offsetTop, rw = room.offsetWidth, rh = room.offsetHeight;
    const X = v => (v / W * 100).toFixed(2), Y = v => (v / H * 100).toFixed(2);
    let d = "";
    stage.querySelectorAll(".piece").forEach((p, i) => {
      const a = f.artworks[i];
      if(!a || !a.pin) return;
      const px = rx + rw * a.pin.x / 100, py = ry + rh * a.pin.y / 100;
      const left = p.offsetLeft, right = left + p.offsetWidth, cx = left + p.offsetWidth / 2;
      const top = p.offsetTop, bottom = top + p.offsetHeight;
      if(py > bottom) d += `M${X(px)} ${Y(py)}H${X(cx)}V${Y(bottom)}`;
      else if(py < top) d += `M${X(px)} ${Y(py)}H${X(cx)}V${Y(top)}`;
      else d += `M${X(px)} ${Y(py)}H${X(px < cx ? left : right)}`;
    });
    svg.innerHTML = d ? `<path d="${d}"/>` : "";
  }

  function renderFloor(id){
    const f = GUIDE.floors.find(x => x.id === id);
    if(!f) return renderFloors();
    document.title = f.name + " | Ctrl+Save";
    const r = f.room || {x:30,y:45,w:40};
    app.innerHTML = `
      <div class="topbar"><a class="pixel-btn" href="#/floors">Back to home page</a></div>
      <section class="page">
        <div class="stage">
          <div class="room" style="${st(r)}">${img(r.src, f.name, "room-img")}</div>
          <svg class="leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          ${f.artworks.map(a => `
            <a class="piece" href="#/art/${esc(a.id)}" style="${st(a)}" aria-label="${esc(a.title)} by ${esc(a.artist)}">
              ${img(a.cutout || a.image, a.title, "piece-img")}
              <span class="tip">${esc(a.title)}</span>
            </a>`).join("")}
        </div>
        <div class="floor-info">
          <h1>${esc(f.name)}</h1>
          <p>${esc(f.description)}</p>
          <ul class="work-list">
            ${f.artworks.map(a => `
              <li><a href="#/art/${esc(a.id)}">
                <span>${esc(a.title)}${a.year ? ", " + esc(a.year) : ""}</span>
                <span class="who">${esc(a.artist)}</span>
              </a></li>`).join("")}
          </ul>
        </div>
      </section>`;

    const stage = app.querySelector(".stage");
    const zooming = zoomFrom && !reduced;
    if(!reduced) explode(stage, zooming ? 450 : 120);
    if(zooming){
      const to = stage.getBoundingClientRect();
      stage.style.transformOrigin = "0 0";
      stage.style.transform = `translate(${zoomFrom.left - to.left}px, ${zoomFrom.top - to.top}px) scale(${zoomFrom.width / to.width})`;
      stage.style.opacity = ".4";
      stage.getBoundingClientRect();
      stage.style.transition = "transform .75s cubic-bezier(.3,.7,.2,1), opacity .5s";
      stage.style.transform = "";
      stage.style.opacity = "";
    }
    zoomFrom = null;

    const redraw = () => drawLeaders(stage, f);
    currentRedraw = redraw;
    redraw();
    stage.addEventListener("load", redraw, true);
    const wait = reduced ? 0 : (zooming ? 450 : 120) + f.artworks.length * 90 + 900;
    setTimeout(() => { redraw(); const s = stage.querySelector(".leaders"); if(s) s.classList.add("on"); }, wait);
    if(location.search.includes("pins")){
      stage.querySelector(".room").addEventListener("click", e => {
        const b = e.currentTarget.getBoundingClientRect();
        const x = Math.round((e.clientX - b.left) / b.width * 100);
        const y = Math.round((e.clientY - b.top) / b.height * 100);
        prompt("Copy this line into the artwork:", `pin: { x: ${x}, y: ${y} },`);
      });
    }
  }

  // Artworks start collapsed into the room, then float up to their positions
  function explode(stage, delay){
    const room = stage.querySelector(".room");
    const rr = room.getBoundingClientRect();
    const cx = rr.left + rr.width / 2, cy = rr.top + rr.width * 0.25;
    stage.querySelectorAll(".piece").forEach((p, i) => {
      const b = p.getBoundingClientRect();
      p.style.transition = "none";
      p.style.transform = `translate(${cx - (b.left + b.width/2)}px, ${cy - (b.top + b.height/2)}px) scale(.15)`;
      p.style.opacity = "0";
      p.getBoundingClientRect();
      const d = delay + i * 90;
      p.style.transition = `transform .9s cubic-bezier(.2,.8,.2,1) ${d}ms, opacity .4s ${d}ms`;
      p.style.transform = "";
      p.style.opacity = "";
    });
  }

  function media(v){
    if(!v) return "";
    if(/\.(mp3|m4a|wav|ogg)$/i.test(v)) return `<div class="audio"><audio src="${esc(v)}" controls preload="metadata"></audio></div>`;
    if(/youtube\.com\/embed|player\.vimeo\.com/.test(v))
      return `<div class="video"><iframe src="${esc(v)}" title="Video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
    return `<div class="video"><video src="${esc(v)}" controls playsinline preload="metadata"></video></div>`;
  }

  function renderArt(id){
    currentRedraw = null;
    const list = allWorks();
    const i = list.findIndex(x => x.a.id === id);
    if(i < 0) return renderFloors();
    const {a, f} = list[i];
    const sameFloor = f.artworks;
    const j = sameFloor.indexOf(a);
    const prev = sameFloor[j - 1], next = sameFloor[j + 1];
    document.title = a.title + " by " + a.artist + " | Ctrl+Save";
    app.innerHTML = `
      <div class="topbar">
        <a class="pixel-btn" href="#/floors">Back to home page</a>
        <a class="crumb" href="#/floor/${esc(f.id)}">${esc(f.name)}</a>
      </div>
      <section class="page">
        <article class="card">
          <div class="card-media">
            <div class="loc">Location: ${esc(a.location || f.name)}</div>
            ${img(a.image || a.cutout, a.title, "art-img")}
          </div>
          <div class="card-text">
            <h1>${esc(a.title)}${a.year ? ", " + esc(a.year) : ""}</h1>
            <p class="by">by ${esc(a.artist)}</p>
            <div class="desc">${(a.description || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
            ${Array.isArray(a.links) && a.links.length ? `<div class="links">${a.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : ""}
            <p class="credit">${esc(GUIDE.credit)} ${esc(a.credit)}</p>
          </div>
        </article>
        ${media(a.video)}
        <nav class="pager" aria-label="More on this floor">
          <span>${prev ? `<a href="#/art/${esc(prev.id)}">Previous: ${esc(prev.title)}</a>` : ""}</span>
          <span>${next ? `<a href="#/art/${esc(next.id)}">Next: ${esc(next.title)}</a>` : ""}</span>
        </nav>
      </section>`;
  }

  // Remember where the clicked floor drawing was, for the zoom-in
  document.addEventListener("click", e => {
    const row = e.target.closest(".floor-row");
    if(row){ const el = row.querySelector(".elev"); if(el) zoomFrom = el.getBoundingClientRect(); }
  });

  function route(){
    const [view, id] = location.hash.replace(/^#\/?/, "").split("/");
    window.scrollTo(0, 0);
    if(view === "floors") renderFloors();
    else if(view === "floor") renderFloor(id);
    else if(view === "art") renderArt(id);
    else renderEnter();
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
